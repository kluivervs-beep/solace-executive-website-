<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solace Globe</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(96vw, 96vh);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    z-index: 1;
    display: none;
  }
  .hero-canvas.is-active { display: block; }
  .fallback {
    font-family: -apple-system, sans-serif;
    color: #A9B4BB;
    font-size: 13px;
    text-align: center;
    padding: 0 24px;
  }
  .globe-label {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #C7A25C;
    text-shadow: 0 1px 6px rgba(11, 20, 27, 0.9);
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 400ms ease-out, color 200ms ease-out;
    will-change: transform, opacity;
  }
  .globe-label::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -8px;
    width: 3px;
    height: 3px;
    margin-left: -1.5px;
    background: #C7A25C;
    border-radius: 50%;
  }
  .globe-label--below::before {
    bottom: auto;
    top: -8px;
  }
</style>
</head>
<body>

<div class="hero">
  <canvas id="heroCanvas" class="hero-canvas"></canvas>
  <div id="fallback" class="fallback">Loading globe…</div>
</div>

<script>
  const CITIES = [
    { name: 'Amsterdam', lat: 52.37, lon: 4.9, blurb: 'Home base, direct reach' },
    { name: 'London', lat: 51, lon: 0, blurb: 'Core market, standing route' },
    { name: 'Paris', lat: 48.85, lon: 2.35, blurb: 'Core market, standing route' },
    { name: 'Berlin', lat: 52.52, lon: 13.405, blurb: 'Fleet partner on the ground' },
    { name: 'Vienna', lat: 48.21, lon: 16.37, blurb: 'Fleet partner on the ground' },
    { name: 'Geneva', lat: 46.2, lon: 6.14, blurb: 'Private jets and yacht charters' },
    { name: 'Zurich', lat: 47.38, lon: 8.54, blurb: 'Private jets and yacht charters' },
    { name: 'Milan', lat: 45.46, lon: 9.19, blurb: 'Fleet partner on the ground' },
    { name: 'Monaco', lat: 43.74, lon: 7.42, blurb: 'Yacht charters, Mediterranean' },
    { name: 'Rome', lat: 41.9, lon: 12.5, blurb: 'Fleet partner on the ground' },
    { name: 'Madrid', lat: 40.42, lon: -3.7, blurb: 'Fleet partner on the ground' },
    { name: 'Barcelona', lat: 41.39, lon: 2.17, blurb: 'Yacht charters, Mediterranean' },
    { name: 'Dubai', lat: 25.2, lon: 55.27, blurb: 'Regional hub, Middle East' },
    { name: 'Riyadh', lat: 24.71, lon: 46.68, blurb: 'Regional hub, Middle East' },
    { name: 'Doha', lat: 25.29, lon: 51.53, blurb: 'Regional hub, Middle East' },
    { name: 'New York', lat: 40.71, lon: -74.0, blurb: 'Fleet partner on the ground' },
    { name: 'Miami', lat: 25.76, lon: -80.19, blurb: 'Yacht charters and transport' },
    { name: 'Los Angeles', lat: 34.05, lon: -118.24, blurb: 'Fleet partner on the ground' },
    { name: 'Sao Paulo', lat: -23.55, lon: -46.63, blurb: 'Regional hub, South America' },
    { name: 'Singapore', lat: 1.35, lon: 103.82, blurb: 'Regional hub, Asia-Pacific' },
    { name: 'Hong Kong', lat: 22.32, lon: 114.17, blurb: 'Fleet partner on the ground' },
    { name: 'Tokyo', lat: 35.68, lon: 139.65, blurb: 'Regional hub, Asia-Pacific' },
    { name: 'Shanghai', lat: 31.23, lon: 121.47, blurb: 'Fleet partner on the ground' },
    { name: 'Sydney', lat: -33.87, lon: 151.21, blurb: 'Fleet partner on the ground' },
    { name: 'Munich', lat: 48.14, lon: 11.58, blurb: 'Fleet partner on the ground' },
    { name: 'Copenhagen', lat: 55.68, lon: 12.57, blurb: 'Fleet partner on the ground' },
    { name: 'Athens', lat: 37.98, lon: 23.73, blurb: 'Yacht charters, Aegean Sea' },
    { name: 'Ibiza', lat: 38.91, lon: 1.43, blurb: 'Yacht charters, Mediterranean' },
    { name: 'Marrakech', lat: 31.63, lon: -7.99, blurb: 'Regional hub, North Africa' },
    { name: 'Cape Town', lat: -33.92, lon: 18.42, blurb: 'Regional hub, Southern Africa' },
    { name: 'Chicago', lat: 41.88, lon: -87.63, blurb: 'Fleet partner on the ground' },
    { name: 'Las Vegas', lat: 36.17, lon: -115.14, blurb: 'Fleet partner on the ground' },
    { name: 'Toronto', lat: 43.65, lon: -79.38, blurb: 'Regional hub, Canada' },
    { name: 'Mexico City', lat: 19.43, lon: -99.13, blurb: 'Regional hub, Latin America' },
    { name: 'Buenos Aires', lat: -34.6, lon: -58.38, blurb: 'Regional hub, South America' },
    { name: 'Seoul', lat: 37.57, lon: 126.98, blurb: 'Regional hub, Asia-Pacific' },
    { name: 'Bangkok', lat: 13.76, lon: 100.5, blurb: 'Regional hub, Southeast Asia' },
    { name: 'Mumbai', lat: 19.08, lon: 72.88, blurb: 'Regional hub, South Asia' },
  ];

  const params = new URLSearchParams(window.location.search);
  const FLIGHT_MODE = params.get('mode') === 'flight';
  const FLIGHT_ORIGIN = FLIGHT_MODE ? {
    name: params.get('oname') || '',
    lat: parseFloat(params.get('olat')),
    lon: parseFloat(params.get('olon')),
  } : null;
  const FLIGHT_DEST = FLIGHT_MODE ? {
    name: params.get('dname') || '',
    lat: parseFloat(params.get('dlat')),
    lon: parseFloat(params.get('dlon')),
  } : null;
  // Great-circle angular separation in degrees (0-180) -- used to scale
  // the arc's bulge so a short regional hop gets a gentle rise instead of
  // the same bulge that suits a hemisphere-spanning route.
  const FLIGHT_ANGULAR_DEG = FLIGHT_MODE ? (() => {
    const toRad = (d) => (d * Math.PI) / 180;
    const cosC = Math.sin(toRad(FLIGHT_ORIGIN.lat)) * Math.sin(toRad(FLIGHT_DEST.lat)) +
      Math.cos(toRad(FLIGHT_ORIGIN.lat)) * Math.cos(toRad(FLIGHT_DEST.lat)) * Math.cos(toRad(FLIGHT_ORIGIN.lon - FLIGHT_DEST.lon));
    return Math.acos(Math.min(1, Math.max(-1, cosC))) * (180 / Math.PI);
  })() : 0;

  const ROUTES = [
    ['Amsterdam', 'London'], ['Amsterdam', 'Paris'], ['Amsterdam', 'Berlin'],
    ['Amsterdam', 'Dubai'], ['Amsterdam', 'New York'], ['Amsterdam', 'Copenhagen'],
    ['Berlin', 'Vienna'], ['Berlin', 'Munich'], ['Vienna', 'Zurich'], ['Zurich', 'Milan'],
    ['Geneva', 'Monaco'], ['Monaco', 'Rome'], ['Rome', 'Athens'], ['Paris', 'Madrid'],
    ['Paris', 'Ibiza'], ['Madrid', 'Barcelona'], ['Barcelona', 'Ibiza'],
    ['Barcelona', 'Milan'], ['Paris', 'Milan'], ['New York', 'Miami'],
    ['New York', 'Chicago'], ['New York', 'Toronto'], ['New York', 'Los Angeles'],
    ['Los Angeles', 'Las Vegas'], ['Los Angeles', 'Tokyo'], ['Miami', 'Sao Paulo'],
    ['Miami', 'Mexico City'], ['Sao Paulo', 'Buenos Aires'], ['Dubai', 'Riyadh'],
    ['Dubai', 'Doha'], ['Dubai', 'Singapore'], ['Dubai', 'Hong Kong'],
    ['Dubai', 'Marrakech'], ['Dubai', 'Mumbai'], ['Marrakech', 'Cape Town'],
    ['Hong Kong', 'Tokyo'], ['Hong Kong', 'Shanghai'], ['Hong Kong', 'Seoul'],
    ['Hong Kong', 'Bangkok'], ['Singapore', 'Bangkok'], ['Singapore', 'Sydney'],
    ['Hong Kong', 'Sydney'],
  ];

  // Flight mode (used by the app's jet estimator) swaps the full
  // marketing network for just the two picked cities and the one arc
  // between them -- same rotating-globe visual, but framing a single
  // route instead of the whole network.
  const ACTIVE_CITIES = FLIGHT_MODE ? [FLIGHT_ORIGIN, FLIGHT_DEST] : CITIES;
  const ACTIVE_ROUTES = FLIGHT_MODE ? [[FLIGHT_ORIGIN.name, FLIGHT_DEST.name]] : ROUTES;

  function postToApp(payload) {
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify(payload));
    }
  }

  function latLonToVector3(THREE, lat, lon, radius) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  async function init() {
    const canvas = document.getElementById('heroCanvas');
    const hero = document.querySelector('.hero');
    const fallback = document.getElementById('fallback');

    const testCtx = canvas.getContext('webgl2') || canvas.getContext('webgl');
    if (!testCtx) { fallback.textContent = 'Your device cannot show the 3D globe.'; return; }

    let THREE;
    try {
      THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
    } catch (err) {
      fallback.textContent = 'Could not load the globe.';
      return;
    }

    try {
      fallback.style.display = 'none';
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
      camera.position.set(0, 0, 6.4);

      const globeGroup = new THREE.Group();
      let earthMesh = null;
      if (FLIGHT_MODE) {
        // A real, lit map with terrain relief and ocean shine reads far
        // more clearly -- and far more detailed -- than a flat, unlit
        // texture once there's no network abstraction left to justify.
        const loader = new THREE.TextureLoader();
        const earthMat = new THREE.MeshPhongMaterial({
          map: loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
          specularMap: loader.load('https://unpkg.com/three-globe/example/img/earth-water.png'),
          bumpMap: loader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
          bumpScale: 0.04,
          specular: new THREE.Color(0x4c5866),
          shininess: 9,
        });
        earthMesh = new THREE.Mesh(new THREE.SphereGeometry(2, 64, 40), earthMat);
        globeGroup.add(earthMesh);

        // Soft "sun" from the upper-front so the relief and ocean
        // highlights actually read, plus enough ambient fill that the
        // unlit side of a close-up view still shows detail instead of
        // going flat black.
        const sun = new THREE.DirectionalLight(0xfff3dd, 1.15);
        sun.position.set(3, 2.4, 4);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xaeb9c4, 0.55));
      } else {
        const wireMat = new THREE.MeshBasicMaterial({ color: 0xb4923d, wireframe: true, transparent: true, opacity: 0.34 });
        globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(2, 28, 18), wireMat));
        const haloMat = new THREE.MeshBasicMaterial({ color: 0xd8bd7c, wireframe: true, transparent: true, opacity: 0.08 });
        globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(2.08, 20, 14), haloMat));
      }

      const NODE_RADIUS = 2.02;
      const cityBase = {};
      const nodePositions = [];
      ACTIVE_CITIES.forEach((city) => {
        const v = latLonToVector3(THREE, city.lat, city.lon, NODE_RADIUS);
        cityBase[city.name] = v;
        nodePositions.push(v.x, v.y, v.z);
      });
      const nodeGeo = new THREE.BufferGeometry();
      nodeGeo.setAttribute('position', new THREE.Float32BufferAttribute(nodePositions, 3));
      const nodeColors = new Float32Array(ACTIVE_CITIES.length * 3);
      for (let i = 0; i < nodeColors.length; i += 3) {
        nodeColors[i] = 0.96; nodeColors[i + 1] = 0.91; nodeColors[i + 2] = FLIGHT_MODE ? 0.88 : 0.78;
      }
      nodeGeo.setAttribute('color', new THREE.Float32BufferAttribute(nodeColors, 3));
      const nodeMat = new THREE.PointsMaterial({ vertexColors: true, size: FLIGHT_MODE ? 0.22 : 0.15, transparent: true, opacity: 0.95 });
      const cityPoints = new THREE.Points(nodeGeo, nodeMat);
      globeGroup.add(cityPoints);

      // Flight mode frames the route with the CAMERA instead of spinning
      // the globe -- it hovers above the route's midpoint, close for a
      // short regional hop and further back for a route that spans much
      // of the earth, the way a map app zooms into a searched location
      // rather than just shrinking the whole world to fit. Computed here
      // (before the arc/marker geometry below) because their sizes need
      // to scale down with the zoom too -- fixed world-unit markers that
      // look right at the default distance turn into huge blobs once the
      // camera is hovering just above the surface for a short hop.
      let flightCamDir = null;
      let flightCamDist = 6.4;
      let flightScale = 1;
      if (FLIGHT_MODE) {
        const originVec = cityBase[FLIGHT_ORIGIN.name];
        const destVec = cityBase[FLIGHT_DEST.name];
        flightCamDir = originVec.clone().normalize().add(destVec.clone().normalize());
        if (flightCamDir.lengthSq() < 1e-6) flightCamDir.set(0, 0, 1);
        flightCamDir.normalize();
        const zoomT = Math.min(1, FLIGHT_ANGULAR_DEG / 150);
        flightCamDist = 2.6 + zoomT * (6.4 - 2.6);
        flightScale = Math.max(0.2, Math.pow(flightCamDist / 6.4, 1.6));
      }

      let flightCurve = null;
      ACTIVE_ROUTES.forEach(([fromName, toName]) => {
        const from = cityBase[fromName];
        const to = cityBase[toName];
        if (!from || !to) return;
        const mid = from.clone().add(to).multiplyScalar(0.5);
        const flightBulge = 1.06 + Math.min(1, FLIGHT_ANGULAR_DEG / 70) * 0.28;
        mid.setLength(NODE_RADIUS * (FLIGHT_MODE ? flightBulge : 1.28));
        const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
        if (FLIGHT_MODE) {
          flightCurve = curve;
          // A soft wider glow tube sits behind a brighter, slightly
          // narrower core -- cheap way to fake bloom without a
          // post-processing pass, and it's what actually makes the route
          // read clearly against the dimmed wireframe instead of just
          // being "a line".
          const glowGeo = new THREE.TubeGeometry(curve, 48, 0.05 * flightScale, 8, false);
          const glowMat = new THREE.MeshBasicMaterial({ color: 0xf5e9c8, transparent: true, opacity: 0.22, depthWrite: false });
          globeGroup.add(new THREE.Mesh(glowGeo, glowMat));
          const tubeGeo = new THREE.TubeGeometry(curve, 48, 0.026 * flightScale, 8, false);
          const tubeMat = new THREE.MeshBasicMaterial({ color: 0xfaf3df, transparent: true, opacity: 0.97 });
          globeGroup.add(new THREE.Mesh(tubeGeo, tubeMat));
        } else {
          const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(24));
          const mat = new THREE.LineBasicMaterial({ color: 0xd8bd7c, transparent: true, opacity: 0.16 });
          globeGroup.add(new THREE.Line(geo, mat));
        }
      });

      // A traveling light riding the route, plus a soft halo behind it --
      // the ambient globe rotation alone read as "pretty but static", this
      // is what actually makes the route feel alive rather than printed on.
      let flightRunner = null;
      let flightRunnerHalo = null;
      if (FLIGHT_MODE && flightCurve) {
        const runnerGeo = new THREE.SphereGeometry(0.05 * flightScale, 12, 12);
        const runnerMat = new THREE.MeshBasicMaterial({ color: 0xfff6df, transparent: true });
        flightRunner = new THREE.Mesh(runnerGeo, runnerMat);
        const haloGeo = new THREE.SphereGeometry(0.115 * flightScale, 12, 12);
        const haloMatRunner = new THREE.MeshBasicMaterial({ color: 0xf0c878, transparent: true, opacity: 0.5, depthWrite: false });
        flightRunnerHalo = new THREE.Mesh(haloGeo, haloMatRunner);
        globeGroup.add(flightRunnerHalo);
        globeGroup.add(flightRunner);
      }

      // Dedicated pulsing markers for the two flight-mode cities -- a
      // gentle breathing scale plus an expanding, fading ring underneath,
      // like a soft radar ping. The shared cityPoints above still exists
      // for click-picking, but its flat dot reads as static next to this.
      const flightMarkers = [];
      if (FLIGHT_MODE) {
        [FLIGHT_ORIGIN, FLIGHT_DEST].forEach((city, i) => {
          const pos = cityBase[city.name];
          if (!pos) return;
          const dotGeo = new THREE.SphereGeometry(0.034 * flightScale, 12, 12);
          const dotMat = new THREE.MeshBasicMaterial({ color: 0xfffdf5 });
          const dot = new THREE.Mesh(dotGeo, dotMat);
          dot.position.copy(pos);
          globeGroup.add(dot);

          const ringGeo = new THREE.RingGeometry(0.05 * flightScale, 0.062 * flightScale, 24);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0xf5e9c8, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.position.copy(pos);
          ring.lookAt(pos.clone().multiplyScalar(2));
          globeGroup.add(ring);

          flightMarkers.push({ dot, ring, phase: i * 0.9 });
        });
      }

      // A quiet starfield behind the globe so it reads as hanging in
      // space instead of floating in an empty void -- static positions
      // with a slow shared opacity shimmer rather than a per-star
      // simulation, which would cost far more for the same felt effect.
      let starField = null;
      if (FLIGHT_MODE) {
        const STAR_COUNT = 220;
        const starPositions = new Float32Array(STAR_COUNT * 3);
        for (let i = 0; i < STAR_COUNT; i++) {
          const r = 7 + Math.random() * 6;
          const a = Math.random() * Math.PI * 2;
          const b = Math.acos(2 * Math.random() - 1);
          starPositions[i * 3] = r * Math.sin(b) * Math.cos(a);
          starPositions[i * 3 + 1] = r * Math.sin(b) * Math.sin(a);
          starPositions[i * 3 + 2] = r * Math.cos(b);
        }
        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xf5f1e6, size: 0.045, transparent: true, opacity: 0.55, depthWrite: false });
        starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);
      }

      scene.add(globeGroup);

      const labelEls = {};
      ACTIVE_CITIES.forEach((city) => {
        const el = document.createElement('span');
        el.className = 'globe-label';
        el.textContent = city.name;
        el.style.opacity = '0';
        hero.appendChild(el);
        labelEls[city.name] = el;
      });

      // Details now live in a native bottom sheet on the app side (photo,
      // blurb, "Ask the concierge" button) -- this page's only job on tap
      // is to tell the app which city, then briefly highlight its label so
      // the tap still feels acknowledged before the sheet appears.
      let selectedCity = null;
      let selectedUntil = 0;

      const raycaster = new THREE.Raycaster();
      raycaster.params.Points.threshold = 0.26;
      const pointerNdc = new THREE.Vector2(-10, -10);

      function pickCityAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return null;
        pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObject(cityPoints);
        if (!hits.length) return null;
        const index = hits[0].index;
        return typeof index === 'number' ? ACTIVE_CITIES[index] : null;
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const size = Math.max(1, rect.width);
        renderer.setSize(size, size, false);
        camera.aspect = 1;
        camera.updateProjectionMatrix();
      }
      canvas.classList.add('is-active');
      resize();
      window.addEventListener('resize', resize);

      window.addEventListener('pointerdown', (e) => {
        const picked = pickCityAt(e.clientX, e.clientY);
        if (!picked) return;
        selectedCity = picked;
        selectedUntil = Date.now() + 900;
        postToApp({ type: 'city-selected', city: picked.name });
      });

      const worldPos = new THREE.Vector3();
      function projectCity(city) {
        const canvasRect = canvas.getBoundingClientRect();
        const heroRect = hero.getBoundingClientRect();
        const base = cityBase[city.name];
        worldPos.copy(base).applyMatrix4(globeGroup.matrixWorld);
        const outward = worldPos.clone().normalize();
        const towardCam = camera.position.clone().sub(worldPos).normalize();
        const facing = outward.dot(towardCam);
        const ndc = worldPos.clone().project(camera);
        const px = (ndc.x * 0.5 + 0.5) * canvasRect.width;
        const py = (1 - (ndc.y * 0.5 + 0.5)) * canvasRect.height;
        const margin = 44;
        const offsetX = Math.min(heroRect.width - margin, Math.max(margin, canvasRect.left - heroRect.left + px));
        const offsetY = canvasRect.top - heroRect.top + py;
        return { facing, offsetX, offsetY };
      }

      // Greedy label declutter: with 40 cities on a small sphere, several
      // always land close enough together to overlap into an illegible
      // pile of text. Each frame, place the most face-on (frontmost)
      // labels first and skip any candidate whose estimated bounding box
      // would collide with one already placed, rather than trying to show
      // every label at once regardless of crowding.
      const placedBoxes = [];
      function estimateLabelWidth(name) {
        return name.length * 7.4 + 10;
      }
      function overlaps(a, b) {
        return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
      }

      function updateLabels() {
        if (selectedCity && Date.now() > selectedUntil) selectedCity = null;

        const all = ACTIVE_CITIES.map((city) => {
          const { facing, offsetX, offsetY } = projectCity(city);
          return { city, facing, offsetX, offsetY, isSelected: selectedCity === city };
        });

        // Flight mode only ever has two labels, so they stay on screen
        // regardless of which side of the globe they're currently facing
        // instead of fading out like a crowded 40-city network would.
        const candidates = FLIGHT_MODE ? all.slice() : all.filter((c) => c.facing >= 0.08);
        candidates.sort((a, b) => (b.isSelected - a.isSelected) || (b.facing - a.facing));

        placedBoxes.length = 0;
        const PAD = 6;
        candidates.forEach((c) => {
          const w = estimateLabelWidth(c.city.name);
          const box = { left: c.offsetX - w / 2 - PAD, right: c.offsetX + w / 2 + PAD, top: c.offsetY - 22, bottom: c.offsetY + 4 };
          c.shown = c.isSelected || FLIGHT_MODE || !placedBoxes.some((b) => overlaps(box, b));
          if (c.shown) placedBoxes.push(box);
        });

        all.forEach((c) => {
          const el = labelEls[c.city.name];
          if (!c.shown) { el.style.opacity = '0'; return; }
          el.style.opacity = (c.isSelected || FLIGHT_MODE) ? '1' : String(Math.min(1, (c.facing - 0.08) / 0.35) * 0.85);
          el.style.color = c.isSelected ? '#F5E9C8' : '#C7A25C';
          // In flight mode the destination's label sits below its point
          // instead of above -- with only two cities, this keeps them
          // from stacking into unreadable overlapping text when they're
          // close together (a short regional hop) rather than opposite
          // sides of the globe.
          const isFlightDest = FLIGHT_MODE && c.city === FLIGHT_DEST;
          el.classList.toggle('globe-label--below', isFlightDest);
          const vOffset = isFlightDest ? '40%' : '-140%';
          el.style.transform = `translate3d(${c.offsetX.toFixed(1)}px, ${c.offsetY.toFixed(1)}px, 0) translate(-50%, ${vOffset}) scale(${c.isSelected ? 1.3 : 1})`;
        });
      }

      const RUNNER_DURATION_MS = 3400;
      const clockStart = performance.now();

      let animating = true;
      function tick() {
        if (!animating) return;

        const elapsedMs = performance.now() - clockStart;
        const elapsedSec = elapsedMs / 1000;

        if (FLIGHT_MODE && flightCamDir) {
          // A slow pendulum-like drift around the route instead of a
          // full spin -- enough parallax on the terrain to feel alive
          // without swinging the two cities out of frame.
          const drift = Math.sin(elapsedSec * 0.15) * 0.24;
          const dir = flightCamDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), drift);
          camera.position.copy(dir.multiplyScalar(flightCamDist));
          camera.lookAt(0, 0, 0);
        } else {
          globeGroup.rotation.y += 0.0016;
        }

        if (flightCurve && flightRunner && flightRunnerHalo) {
          const raw = (elapsedMs % RUNNER_DURATION_MS) / RUNNER_DURATION_MS;
          const eased = raw < 0.5 ? 2 * raw * raw : -1 + (4 - 2 * raw) * raw;
          const pos = flightCurve.getPoint(eased);
          flightRunner.position.copy(pos);
          flightRunnerHalo.position.copy(pos);
          const fade = Math.min(1, raw / 0.08) * Math.min(1, (1 - raw) / 0.08);
          flightRunner.material.opacity = fade;
          flightRunnerHalo.material.opacity = 0.5 * fade;
        }

        flightMarkers.forEach((m) => {
          const dotScale = 1 + Math.sin(elapsedSec * 1.6 + m.phase) * 0.12;
          m.dot.scale.setScalar(dotScale);
          const ringT = (elapsedSec * 0.55 + m.phase * 0.3) % 1;
          m.ring.scale.setScalar(1 + ringT * 2.2);
          m.ring.material.opacity = 0.6 * (1 - ringT);
        });

        if (starField) {
          starField.material.opacity = 0.4 + Math.sin(elapsedSec * 0.6) * 0.15;
        }

        globeGroup.updateMatrixWorld(true);
        renderer.render(scene, camera);
        updateLabels();
        requestAnimationFrame(tick);
      }
      tick();

      document.addEventListener('visibilitychange', () => {
        animating = !document.hidden;
        if (animating) tick();
      });
    } catch (err) {
      fallback.style.display = 'block';
      fallback.textContent = 'Could not load the globe.';
    }
  }

  init();
</script>

</body>
</html>
