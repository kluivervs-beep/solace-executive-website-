<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitation | Solace Executive</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/icons/monogram.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180,146,61,0.10), transparent 60%),
      linear-gradient(180deg, #0B141B 0%, #0F1B24 55%, #0C161D 100%);
    padding: var(--space-4);
  }
  .join-wrap { width: 100%; max-width: 420px; text-align: center; }
  .join-mark { width: 40px; height: 40px; margin-bottom: var(--space-3); }
  .join-eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--color-gold-light);
    margin-bottom: var(--space-2);
  }
  .join-title {
    font-family: 'Cormorant', serif;
    font-style: italic;
    font-size: 30px;
    color: var(--color-ink);
    margin-bottom: var(--space-2);
  }
  .join-body {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--color-ink-muted);
    margin-bottom: var(--space-4);
  }
  .join-code-box {
    border: 1px solid var(--color-gold-dim);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: var(--space-3);
    background: rgba(255,255,255,0.02);
  }
  .join-code-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--color-ink-muted);
    margin-bottom: 8px;
  }
  .join-code-value {
    font-family: 'Cormorant', serif;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--color-gold-light);
  }
  .join-open-btn {
    display: block;
    width: 100%;
    margin-bottom: var(--space-3);
  }
  .join-hint {
    font-family: 'Montserrat', sans-serif;
    font-size: 12.5px;
    color: var(--color-ink-muted);
    line-height: 1.6;
  }
  .join-error {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    color: var(--color-ink-muted);
  }
</style>
</head>
<body>

<div class="join-wrap">
  <img class="join-mark" src="assets/icons/monogram.svg" alt="">
  <div id="joinContent">
    <div class="join-eyebrow">Solace Executive</div>
    <div class="join-title" id="joinTitle">You are invited</div>
    <p class="join-body" id="joinBody">Tap below to open the Solace Executive app with your code already in place.</p>
    <div class="join-code-box">
      <div class="join-code-label" id="joinCodeLabel">Your code</div>
      <div class="join-code-value" id="joinCode">&mdash;</div>
    </div>
    <button type="button" class="btn btn-primary join-open-btn" id="joinOpenBtn">Open the app</button>
    <p class="join-hint" id="joinHint">Don't have the app yet? Open it once installed and enter the code above under "Request access".</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = (params.get('code') || '').trim().toUpperCase();
  const lang = (params.get('lang') || 'en').toLowerCase() === 'nl' ? 'nl' : 'en';
  const codeEl = document.getElementById('joinCode');

  const COPY = {
    en: {
      title: 'You are invited',
      body: 'Tap below to open the Solace Executive app with your code already in place.',
      codeLabel: 'Your code',
      openBtn: 'Open the app',
      hint: 'Don’t have the app yet? Open it once installed and enter the code above under "Request access".',
      error: 'This invitation is missing a code. Ask the person who invited you to send the link again.',
    },
    nl: {
      title: 'U bent uitgenodigd',
      body: 'Tik hieronder om de Solace Executive app te openen met uw code al klaar.',
      codeLabel: 'Uw code',
      openBtn: 'Open de app',
      hint: 'Heeft u de app nog niet? Open de app zodra deze is geïnstalleerd en vul de code hierboven in bij "Toegang aanvragen".',
      error: 'Deze uitnodiging mist een code. Vraag de persoon die u uitnodigde om de link opnieuw te sturen.',
    },
  }[lang];

  document.documentElement.lang = lang;
  document.title = (lang === 'nl' ? 'Uitnodiging' : 'Invitation') + ' | Solace Executive';
  document.getElementById('joinTitle').textContent = COPY.title;
  document.getElementById('joinBody').textContent = COPY.body;
  document.getElementById('joinCodeLabel').textContent = COPY.codeLabel;
  document.getElementById('joinOpenBtn').textContent = COPY.openBtn;
  document.getElementById('joinHint').textContent = COPY.hint;

  if (!code) {
    document.getElementById('joinContent').innerHTML = '<p class="join-error">' + COPY.error + '</p>';
  } else {
    codeEl.textContent = code;
    const appUrl = 'solaceexecutive://join?code=' + encodeURIComponent(code);

    // A programmatic window.location redirect on page load, with no user
    // gesture behind it, is routinely ignored by iOS Safari (it treats an
    // unprompted scheme jump as something to block, same category as an
    // unsolicited popup). A real tap on a button is a genuine user
    // gesture, which Safari reliably honors -- so that's the button below,
    // and this is just a courtesy attempt in case the browser allows it.
    window.location.href = appUrl;

    document.getElementById('joinOpenBtn').addEventListener('click', () => {
      window.location.href = appUrl;
    });
  }
</script>

</body>
</html>
